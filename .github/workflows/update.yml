name: update

on:
  schedule:
    - cron: '37 6 * * *'   # cada día
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Busca versiones nuevas y las prueba. Solo lectura: aquí se ejecuta código descargado.
  check:
    runs-on: windows-2025
    outputs:
      changed: ${{ steps.checkver.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Instalar Scoop
        shell: pwsh
        run: |
          iex "& {$(irm get.scoop.sh)} -RunAsAdmin"
          "$env:USERPROFILE\scoop\shims" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Buscar versiones nuevas
        id: checkver
        shell: pwsh
        run: |
          # checkver de Scoop: lee la última release y reescribe versión, URL y hash
          & "$env:USERPROFILE\scoop\apps\scoop\current\bin\checkver.ps1" -Dir "$PWD\bucket" -Update
          $changed = [bool](git status --porcelain bucket)
          "changed=$($changed.ToString().ToLower())" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT

      - name: Probar los manifiestos actualizados
        if: steps.checkver.outputs.changed == 'true'
        shell: pwsh
        run: |
          foreach ($m in Get-ChildItem bucket/*.json) {
            scoop install $m.FullName
            $out = & $m.BaseName --version
            if ($out -notmatch $m.BaseName) { throw "$($m.BaseName) no se instaló bien" }
          }

      - uses: actions/upload-artifact@v7
        if: steps.checkver.outputs.changed == 'true'
        with:
          name: bucket
          path: bucket/*.json

  # Publica lo ya probado. Tiene escritura, pero no ejecuta nada descargado.
  publish:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: bucket
          path: bucket

      - name: Commit y push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket
          git commit -m "Actualizar: $(git diff --cached --name-only | xargs -n1 basename | sed 's/.json$//' | paste -sd, -)"
          git push
